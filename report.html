<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">

```
<a href="index.html" class="logo">
  CollegeClean
</a>

<nav class="navbar">
  <a href="index.html">HOME</a>
  <a href="feedback.html">FEEDBACK</a>
  <a href="howitwork.html">HOW IT WORKS</a>
  <a href="faqs.html">FAQS</a>
</nav>
```

  </header>

  <main>

```
<section class="form-section">

  <div class="form-heading">
    <span>🌿</span>

    <h1>REPORT AN ISSUE</h1>

    <p>
      Help us keep the campus clean by reporting a cleanliness problem.
    </p>
  </div>


  <form id="reportForm" class="clean-form">

    <label for="reporterName">
      Your Name
    </label>

    <input
      type="text"
      id="reporterName"
      placeholder="Enter your name"
      required
    >


    <label for="category">
      Issue Category
    </label>

    <select id="category" required>

      <option value="">
        Select a category
      </option>

      <option value="Garbage">
        🗑️ Garbage
      </option>

      <option value="Washroom">
        🚻 Washroom
      </option>

      <option value="Water">
        💧 Water
      </option>

      <option value="Classroom">
        🏫 Classroom
      </option>

      <option value="Canteen">
        🍴 Canteen
      </option>

      <option value="Other">
        📌 Other
      </option>

    </select>


    <label for="location">
      Location
    </label>

    <input
      type="text"
      id="location"
      placeholder="Example: Block A, 2nd Floor"
      required
    >


    <label for="description">
      Describe the Problem
    </label>

    <textarea
      id="description"
      rows="5"
      placeholder="Explain what needs attention..."
      required
    ></textarea>


    <label for="photo">
      Upload Photo
    </label>

    <input
      type="file"
      id="photo"
      accept="image/*"
    >


    <button type="submit" class="main-btn">
      SUBMIT REPORT
    </button>

  </form>

</section>
```

  </main>

 
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>

</body>
</html>
